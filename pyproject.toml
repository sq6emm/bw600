[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bw600"
version = "0.1.0"
description = "Linux control application for the ATORCH BW600 electronic load / battery tester"
requires-python = ">=3.10"
authors = [{ name = "SQ6EMM" }]
dependencies = ["matplotlib"]

[project.scripts]
bw600 = "bw600.cli:main"

[tool.setuptools]
packages = ["bw600"]
